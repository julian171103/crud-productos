<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventario de la tienda</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top bar: title, search and "new product" button (stays at the top) -->
  <header class="top-bar">
    <h1>Inventario de la tienda</h1>
    <div class="top-controls">
      <input type="text" id="search-input" placeholder="Buscar producto...">
      <button id="new-button">Nuevo producto</button>
    </div>
  </header>

  <main>
    <!-- Messages: loading, no results, errors, success -->
    <p id="message">Cargando...</p>

    <!-- JavaScript puts one card here for each product -->
    <section id="cards" class="cards"></section>
  </main>

  <!-- Pop up with the product detail -->
  <dialog id="detail-popup">
    <button id="detail-close" class="close-button">X</button>
    <h2 id="detail-name"></h2>
    <p id="detail-description"></p>
    <p id="detail-price"></p>
    <p id="detail-stock"></p>
    <div class="buttons">
      <button id="edit-button">Editar</button>
      <button id="delete-button" class="danger">Eliminar</button>
    </div>
  </dialog>

  <!-- Pop up with the form (used to create and to edit) -->
  <dialog id="form-popup">
    <button id="form-close" class="close-button">X</button>
    <h2 id="form-title">Nuevo producto</h2>

    <form id="product-form">
      <label for="name-input">Nombre</label>
      <input type="text" id="name-input" maxlength="100">

      <label for="description-input">Descripción</label>
      <input type="text" id="description-input" maxlength="255">

      <label for="price-input">Precio (USD)</label>
      <input type="number" id="price-input" step="0.01" min="0">

      <label for="stock-input">Stock</label>
      <input type="number" id="stock-input" step="1" min="0">

      <p id="form-error" class="error"></p>

      <div class="buttons">
        <button type="submit" id="save-button">Guardar</button>
        <button type="button" id="cancel-button">Cancelar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
